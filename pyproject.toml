[project]
name = "creative-agent"
version = "0.1.0"
description = "In-house transcript composition and ElevenLabs enhancement pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "mangum>=0.19",
    "openai>=1.40",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "python-dotenv>=1.0",
]
orchestrator = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "transcript_composer*", "tts_enhancer*", "tts_pipeline*", "pipeline_orchestrator*", "db*", "queues*", "models*", "observability*"]

[tool.setuptools.package-data]
transcript_composer = ["data/*.json", "data/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
